<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete IELTS Mock Results</title><style>html,body{margin:0;height:100%;font-family:Arial}#exam{width:100%;height:100%;border:0}.panel{position:fixed;right:18px;bottom:18px;z-index:9999;background:white;border:3px solid #a50034;border-radius:14px;padding:16px;box-shadow:0 8px 30px #0004;max-width:390px}.panel button{background:#a50034;color:white;border:0;border-radius:8px;padding:11px 13px;font-weight:700;cursor:pointer;margin:3px}.scores{font-size:16px;line-height:1.8}.big{font-size:24px;font-weight:800;color:#a50034}.overall{font-size:24px;color:#a50034}.note{font-size:11px;color:#666}.finalbtn{width:100%;font-size:16px;background:#17202a!important}</style></head><body><iframe id="exam" src="index.html"></iframe><div class="panel"><div class="big">IELTS Mock Results</div><div class="scores" id="scores">Reading: —<br>Writing: —<br>Speaking: —<hr><b class="overall">Mock Overall: —</b></div><p><button onclick="captureReading()">Get Reading</button><button onclick="scoreWriting()">Score Writing</button><button onclick="scoreSpeaking()">Score Speaking</button></p><button class="finalbtn" onclick="showOverall()">SHOW FINAL OVERALL RESULT</button><div class="note">Reading is based on correct answers. Writing and Speaking are automated practice estimates. Overall uses these 3 sections only because Listening is not included.</div></div><script>
const frame=document.getElementById('exam');let S={reading:null,writing:null,speaking:null};let starts={},dur={1:0,2:0,3:0},texts={1:'',2:'',3:''};
function roundHalf(x){return Math.round(x*2)/2}
function refresh(){let a=S.reading??'—',b=S.writing??'—',c=S.speaking??'—';let o=(S.reading!==null&&S.writing!==null&&S.speaking!==null)?roundHalf((S.reading+S.writing+S.speaking)/3):'—';document.getElementById('scores').innerHTML=`Reading: <b>${a}</b><br>Writing: <b>${b}</b><br>Speaking: <b>${c}</b><hr><b class="overall">Mock Overall: ${o}</b>`;return o}
function captureReading(){let d=frame.contentDocument,txt=d.getElementById('result')?.innerText||'',m=txt.match(/Band\s+([0-9.]+)/i);if(m){S.reading=parseFloat(m[1]);refresh();alert('Reading Band captured: '+S.reading)}else alert('First open Academic Reading and press Submit Reading & Show Estimated Band. Then press Get Reading here.')}
function textBand(t,min){t=(t||'').trim();let w=t?t.split(/\s+/):[];if(w.length<Math.max(60,min*.4))return 4;let sent=(t.match(/[.!?]+/g)||[]).length||1,paras=t.split(/\n\s*\n/).filter(x=>x.trim()).length,clean=w.map(x=>x.toLowerCase().replace(/[^a-z'-]/g,'')),uniq=new Set(clean.filter(Boolean)).size,div=uniq/Math.max(1,clean.length),conn=(t.match(/\b(however|therefore|moreover|whereas|although|while|consequently|nevertheless|in contrast|for example|overall|respectively|furthermore)\b/gi)||[]).length,avg=w.length/sent,b=5;if(w.length>=min)b+=.75;if(paras>=3)b+=.5;if(div>.48)b+=.5;if(conn>=4)b+=.5;if(avg>=14&&avg<=28)b+=.5;if(w.length>=min*1.25)b+=.25;return Math.min(8,roundHalf(b))}
function scoreWriting(){let d=frame.contentDocument,w1=d.getElementById('w1')?.value||'',w2=d.getElementById('w2')?.value||'';if(!w1.trim()&&!w2.trim()){alert('Complete Writing Tasks 1 and 2 first.');return}let b1=textBand(w1,150),b2=textBand(w2,250);S.writing=roundHalf((b1+2*b2)/3);refresh();alert(`Estimated Writing Band: ${S.writing}\nTask 1: ${b1}\nTask 2: ${b2}`)}
function scoreSpeaking(){let total=dur[1]+dur[2]+dur[3],t=(texts[1]+' '+texts[2]+' '+texts[3]).trim(),w=t?t.split(/\s+/).filter(Boolean):[],fill=(t.match(/\b(um|uh|erm|like|you know)\b/gi)||[]).length,uniq=new Set(w.map(x=>x.toLowerCase().replace(/[^a-z'-]/g,''))).size,div=uniq/Math.max(1,w.length),b=4;if(total>=120)b+=.5;if(total>=240)b+=.5;if(w.length>=180)b+=.5;if(w.length>=300)b+=.5;if(div>.45)b+=.5;if(div>.55)b+=.5;if(fill/Math.max(1,w.length)<.03)b+=.5;if(w.length===0&&total>=120)b=6;S.speaking=Math.min(8,roundHalf(b));refresh();alert(`Estimated Speaking Band: ${S.speaking}\nRecorded time: ${Math.round(total)} sec\nRecognised words: ${w.length}`)}
function showOverall(){captureReadingSilent();if(S.reading===null||S.writing===null||S.speaking===null){let miss=[];if(S.reading===null)miss.push('Reading');if(S.writing===null)miss.push('Writing');if(S.speaking===null)miss.push('Speaking');alert('Overall result is not ready. Complete/score: '+miss.join(', '));return}let o=refresh();let level=o>=8?'Very Good User':o>=7?'Good User':o>=6?'Competent User':o>=5?'Modest User':'Limited User';alert(`FINAL IELTS PRACTICE RESULT\n\nReading: ${S.reading}\nWriting: ${S.writing}\nSpeaking: ${S.speaking}\n\nMOCK OVERALL BAND: ${o}\nLevel: ${level}`)}
function captureReadingSilent(){let d=frame.contentDocument,txt=d.getElementById('result')?.innerText||'',m=txt.match(/Band\s+([0-9.]+)/i);if(m)S.reading=parseFloat(m[1]);refresh()}
function install(){let w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||typeof w.markReading!=='function'){setTimeout(install,200);return}if(w.__scoreInstalled)return;w.__scoreInstalled=true;let mr=w.markReading;w.markReading=function(){mr();setTimeout(captureReadingSilent,150)};let origStart=w.startRecording,origStop=w.stopRecording;w.startRecording=async function(part){starts[part]=Date.now();let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.continuous=true;r.interimResults=false;r.lang='en-US';r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)texts[part]+=' '+e.results[i][0].transcript};window['_sr'+part]=r;try{r.start()}catch(e){}}return origStart(part)};w.stopRecording=function(part){if(starts[part]){dur[part]+=(Date.now()-starts[part])/1000;starts[part]=null}let r=window['_sr'+part];if(r)try{r.stop()}catch(e){}return origStop(part)}}
frame.onload=install;refresh();
</script></body></html>
