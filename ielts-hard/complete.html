<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete IELTS Mock Results</title><style>html,body{margin:0;height:100%;font-family:Arial}#exam{width:100%;height:100%;border:0}.panel{position:fixed;right:18px;bottom:18px;z-index:9999;background:white;border:2px solid #a50034;border-radius:14px;padding:14px;box-shadow:0 8px 30px #0003;max-width:340px}.panel button{background:#a50034;color:white;border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}.scores{font-size:14px;line-height:1.7}.big{font-size:24px;font-weight:800;color:#a50034}.note{font-size:11px;color:#666}.hidden{display:none}</style></head><body><iframe id="exam" src="index.html"></iframe><div class="panel"><div class="big">IELTS Mock Scores</div><div class="scores" id="scores">Reading: —<br>Writing: —<br>Speaking: —<br><b>Mock Overall: —</b></div><p><button onclick="scoreWriting()">Score Writing</button> <button onclick="scoreSpeaking()">Score Speaking</button></p><div class="note">Reading is based on correct answers. Writing and Speaking are automated practice estimates, not official IELTS examiner scores. Overall here uses the 3 available sections only.</div></div><script>
const frame=document.getElementById('exam');let S={reading:null,writing:null,speaking:null};let starts={},dur={1:0,2:0,3:0},texts={1:'',2:'',3:''};
function roundHalf(x){return Math.round(x*2)/2}function refresh(){let a=S.reading===null?'—':S.reading,b=S.writing===null?'—':S.writing,c=S.speaking===null?'—':S.speaking;let o=(S.reading!==null&&S.writing!==null&&S.speaking!==null)?roundHalf((S.reading+S.writing+S.speaking)/3):'—';document.getElementById('scores').innerHTML=`Reading: <b>${a}</b><br>Writing: <b>${b}</b><br>Speaking: <b>${c}</b><br><b>Mock Overall: ${o}</b>`}
function textBand(t,min){t=(t||'').trim();let w=t?t.split(/\s+/):[];if(w.length<Math.max(60,min*.4))return 4;let sent=(t.match(/[.!?]+/g)||[]).length||1,paras=t.split(/\n\s*\n/).filter(x=>x.trim()).length,clean=w.map(x=>x.toLowerCase().replace(/[^a-z'-]/g,'')),uniq=new Set(clean.filter(Boolean)).size,div=uniq/Math.max(1,clean.length),conn=(t.match(/\b(however|therefore|moreover|whereas|although|while|consequently|nevertheless|in contrast|for example|overall|respectively|furthermore)\b/gi)||[]).length,avg=w.length/sent,b=5;if(w.length>=min)b+=.75;if(paras>=3)b+=.5;if(div>.48)b+=.5;if(conn>=4)b+=.5;if(avg>=14&&avg<=28)b+=.5;if(w.length>=min*1.25)b+=.25;return Math.min(8,roundHalf(b))}
function scoreWriting(){let d=frame.contentDocument,w1=d.getElementById('w1')?.value||'',w2=d.getElementById('w2')?.value||'',b1=textBand(w1,150),b2=textBand(w2,250);S.writing=roundHalf((b1+2*b2)/3);refresh();alert(`Estimated Writing Band: ${S.writing}\nTask 1: ${b1}\nTask 2: ${b2}`)}
function scoreSpeaking(){let total=dur[1]+dur[2]+dur[3],t=(texts[1]+' '+texts[2]+' '+texts[3]).trim(),w=t?t.split(/\s+/).filter(Boolean):[],fill=(t.match(/\b(um|uh|erm|like|you know)\b/gi)||[]).length,uniq=new Set(w.map(x=>x.toLowerCase().replace(/[^a-z'-]/g,''))).size,div=uniq/Math.max(1,w.length),b=4;if(total>=120)b+=.5;if(total>=240)b+=.5;if(w.length>=180)b+=.5;if(w.length>=300)b+=.5;if(div>.45)b+=.5;if(div>.55)b+=.5;if(fill/Math.max(1,w.length)<.03)b+=.5;if(w.length===0&&total>=120)b=6;S.speaking=Math.min(8,roundHalf(b));refresh();alert(`Estimated Speaking Band: ${S.speaking}\nRecorded time: ${Math.round(total)} sec\nRecognised words: ${w.length}`)}
function install(){let w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||typeof w.markReading!=='function'){setTimeout(install,200);return}if(w.__scoreInstalled)return;w.__scoreInstalled=true;let mr=w.markReading;w.markReading=function(){mr();setTimeout(()=>{let txt=d.getElementById('result')?.innerText||'',m=txt.match(/Band\s+([0-9.]+)/i);if(m){S.reading=parseFloat(m[1]);refresh()}},100)};for(let p=1;p<=3;p++){let origStart=w.startRecording,origStop=w.stopRecording;if(!w.__recHooked){w.__recHooked=true;w.startRecording=async function(part){starts[part]=Date.now();let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let r=new SR();r.continuous=true;r.interimResults=true;r.lang='en-US';r.onresult=e=>{let z='';for(let i=e.resultIndex;i<e.results.length;i++)z+=e.results[i][0].transcript+' ';texts[part]+=' '+z};window['_sr'+part]=r;try{r.start()}catch(e){}}return origStart(part)};w.stopRecording=function(part){if(starts[part])dur[part]+=(Date.now()-starts[part])/1000;let r=window['_sr'+part];if(r)try{r.stop()}catch(e){}return origStop(part)}}} }
frame.onload=install;refresh();
</script></body></html>
