<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Link Manager</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;padding:40px}.card{max-width:900px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 12px 40px #0001}input,button{font-size:16px;padding:13px;margin:5px 0}input{width:55%}button{cursor:pointer}#out{margin-top:20px;word-break:break-all;padding:15px;background:#f7f9fc;border-radius:10px}.err{color:#b42318}.ok{color:#067647}code{user-select:all}</style></head><body><div class="card"><h1>Dr. Mousa Basyouni – Exam Link Manager</h1><p>Create a personal student link. Each generated link permits <b>2 exam starts</b>.</p><input id="adminKey" type="password" autocomplete="off" placeholder="Admin key from Apps Script" aria-label="Admin key"><p style="font-size:13px;color:#555;margin:4px 0 14px">The key stays in this browser session and is not added to the page URL.</p><input id="name" placeholder="Student name / label"><button id="create">Create New 2-Attempt Link</button><div id="out">Ready.</div></div><script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbxGO-_gsJAAsDVpaKgp6BM5OQVjP5fe-OQxGY-M6lFi0I17ROXZlX5hGlouOllAfM20DA/exec';
const STUDENT='https://hme77e.github.io/tax-agent-exam/student.html';
const ADMIN_KEY_FROM_URL=new URLSearchParams(location.search).get('key')||''; const keyField=document.getElementById('adminKey'); keyField.value=ADMIN_KEY_FROM_URL||sessionStorage.getItem('tax_admin_key')||'';
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const s=document.createElement('script');window[cb]=d=>{delete window[cb];s.remove();resolve(d)};s.onerror=()=>{delete window[cb];s.remove();reject(new Error('Connection failed'))};params.callback=cb;s.src=ENDPOINT+'?'+new URLSearchParams(params);document.head.appendChild(s);});}
document.getElementById('create').onclick=async()=>{const out=document.getElementById('out'),btn=document.getElementById('create'),label=document.getElementById('name').value.trim();if(!label){out.className='err';out.textContent='Enter student name first.';return}const ADMIN_KEY=keyField.value.trim();if(!ADMIN_KEY){out.className='err';out.textContent='Enter the ADMIN_KEY from your Apps Script project. This key is required to create student links.';return}sessionStorage.setItem('tax_admin_key',ADMIN_KEY);btn.disabled=true;out.className='';out.textContent='Creating link...';try{const r=await jsonp({action:'create',key:ADMIN_KEY,label});if(!r||!r.ok||!r.token)throw new Error((r&&r.message)||'Link was not created');const link=STUDENT+'?token='+encodeURIComponent(r.token);out.className='ok';out.innerHTML='<b>Student:</b> '+label+'<br><b>Uses:</b> 0/2<br><br><b>Student link:</b><br><code>'+link+'</code><br><br><button id="copy">Copy Link</button>';document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(link);}catch(e){out.className='err';out.textContent='ERROR: '+e.message+(e.message==='Access denied'?' — Check the ADMIN_KEY entered above.':' — Check the Apps Script web app deployment.');}finally{btn.disabled=false}};
</script></body></html>
