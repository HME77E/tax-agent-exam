<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UAE Tax Agent Experienced Exam - Dr. Mousa Basyouni</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;color:#132238;margin:0}main{max-width:900px;margin:35px auto;padding:20px}.card{background:#fff;padding:25px;border-radius:16px;border:1px solid #dfe6ee}.option{display:block;padding:12px;margin:8px 0;border:1px solid #dfe6ee;border-radius:10px;cursor:pointer}button{padding:12px 18px;border:0;border-radius:10px;background:#0b5cab;color:#fff;font-weight:bold;cursor:pointer}.nav{display:flex;justify-content:space-between;margin-top:20px}.hidden{display:none}.score{font-size:48px;font-weight:bold}</style></head><body><main><div id="start" class="card"><h1>UAE Tax Agent – Experienced Certification Exam</h1><p><b>Prepared & Supervised by Dr. Mousa Basyouni</b></p><p>30 MCQ Questions • 60 Minutes • Passing Score: 70%</p><p>Questions 11–30 are experienced-level practical and case-based questions.</p><input id="name" placeholder="Student Full Name" style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box"><input id="email" placeholder="Email Address" style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box"><button onclick="startExam()">Start Exam</button></div><div id="exam" class="card hidden"><h3 id="qlabel"></h3><h2 id="qtext"></h2><div id="opts"></div><div class="nav"><button onclick="prev()">Previous</button><button onclick="next()">Next</button><button onclick="submitExam()">Submit Exam</button></div></div><div id="result" class="card hidden"><h1>Exam Result</h1><div id="score" class="score"></div><h2 id="status"></h2><p id="detail"></p></div></main><script src="../experienced-exam/questions.js"></script><script>let i=0,a=[];function startExam(){if(!name.value.trim()||!email.value.trim()){alert('Enter student name and email');return}a=new Array(questions.length).fill(null);start.classList.add('hidden');exam.classList.remove('hidden');render()}function render(){let q=questions[i];qlabel.textContent='Question '+(i+1)+' of 30'+(i>=10?' • Experienced Level':'');qtext.textContent=q.q;opts.innerHTML='';q.options.forEach((x,j)=>{let l=document.createElement('label');l.className='option';l.innerHTML='<input type="radio" name="o" '+(a[i]===j?'checked':'')+'> '+String.fromCharCode(65+j)+'. '+x;l.onclick=()=>{a[i]=j;render()};opts.appendChild(l)})}function prev(){if(i>0){i--;render()}}function next(){if(i<29){i++;render()}}function submitExam(){if(!confirm('Submit exam now?'))return;let c=0;a.forEach((x,j)=>{if(x===questions[j].answer)c++});let p=Math.round(c/30*100);exam.classList.add('hidden');result.classList.remove('hidden');score.textContent=p+'%';status.textContent=p>=70?'PASS':'FAIL';detail.textContent='Correct answers: '+c+' of 30'}</script></body></html>
