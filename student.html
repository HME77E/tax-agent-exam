<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UAE Tax Agent Exam - Dr. Mousa Basyouni</title><style>html,body,#exam{width:100%;height:100%;margin:0;border:0;overflow:hidden}#status{position:fixed;bottom:10px;right:10px;background:#fff;padding:6px 10px;border-radius:8px;font:12px Arial;box-shadow:0 2px 8px #0002;display:none}</style></head><body><iframe id="exam" src="index.html"></iframe><div id="status"></div><iframe name="resultReceiver" style="display:none"></iframe><form id="resultForm" method="POST" target="resultReceiver" style="display:none"><input type="hidden" name="payload" id="payload"></form><script>const ENDPOINT='https://script.google.com/macros/s/AKfycbx5HJIZJOTLI6Qh6eSZzkPoKt_8OgSXqGlSOcntEHYxttoEtFXFLThqBo8cp8drZB2MoQ/exec';const frame=document.getElementById('exam');frame.onload=()=>{const w=frame.contentWindow;if(!w||typeof w.submitExam!=='function')return;const original=w.submitExam;w.submitExam=function(auto){const before=w.localStorage.getItem('tax_exam_result');original(auto);setTimeout(()=>{const after=w.localStorage.getItem('tax_exam_result');const finished=!w.document.getElementById('resultScreen').classList.contains('hidden');if(!finished||!after||after===before)return;try{const data=JSON.parse(after);document.getElementById('payload').value=JSON.stringify(data);const f=document.getElementById('resultForm');f.action=ENDPOINT;f.submit();const s=document.getElementById('status');s.textContent='Result submitted';s.style.display='block';setTimeout(()=>s.style.display='none',3000)}catch(e){}},150)}};</script></body></html>
